[project]
name = "semantic-frame-search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "sentence-transformers>=3.4,<6",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.66.5",
    "transformers>=4.50,<5",
    "yt-dlp>=2026.8.19",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
